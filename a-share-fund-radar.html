<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>A股资金雷达</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#131e30;--line:#26354b;--muted:#91a1b8;--text:#eef4ff;--green:#20c997;--red:#ff647c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
header,main{max-width:1000px;margin:auto}header{padding:22px 2px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:23px;margin:0 0 5px}.sub,.muted{color:var(--muted);font-size:12px}.status{font-size:12px;padding:7px 10px;border:1px solid var(--line);border-radius:20px;white-space:nowrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}.toolbar button{background:#18263a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:13px}.toolbar button.active{background:#23436b;border-color:#477db8}.toolbar button:disabled{opacity:.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;min-width:0}.label{font-size:12px;color:var(--muted)}.value{font-size:20px;font-weight:700;margin-top:7px;overflow:hidden;text-overflow:ellipsis}.tablebox{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.tablehead{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid var(--line);gap:8px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}th,td{text-align:right;padding:12px 10px;border-bottom:1px solid #223047;font-size:13px;white-space:nowrap}th{color:var(--muted);font-weight:500;font-size:11px}th:first-child,td:first-child{text-align:left;padding-left:14px}.name{font-weight:650}.pos{color:var(--red)}.neg{color:var(--green)}.neutral{color:var(--muted)}.notice{margin:12px 2px 25px;color:var(--muted);font-size:11px;line-height:1.7}.error{padding:24px;text-align:center;color:var(--muted)}.foot{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;color:var(--muted);font-size:11px}
@media(min-width:700px){body{padding-left:24px;padding-right:24px}.value{font-size:24px}}
</style>
</head>
<body>
<header><div><h1>📡 A股资金雷达</h1><div class="sub">行业 / 概念板块 · 主力资金观察</div></div><div class="status" id="status">等待连接</div></header>
<main>
<div class="toolbar"><button class="active" data-kind="industry">行业板块</button><button data-kind="concept">概念板块</button><button id="refresh">↻ 手动刷新</button></div>
<section class="stats">
<div class="card"><div class="label">当前监控板块</div><div class="value" id="count">—</div></div>
<div class="card"><div class="label">主力净流入家数</div><div class="value pos" id="inCount">—</div></div>
<div class="card"><div class="label">主力净流出家数</div><div class="value neg" id="outCount">—</div></div>
</section>
<section class="tablebox">
<div class="tablehead"><div><b id="tableTitle">行业板块资金排名</b><div class="muted" id="updated">尚未取得数据</div></div><span class="muted">按主力净流入排序</span></div>
<div class="tablewrap"><table><thead><tr><th>板块</th><th>涨跌幅</th><th>主力净流入</th><th>主力占比</th></tr></thead><tbody id="rows"><tr><td colspan="4" class="error">正在尝试连接公开数据源…</td></tr></tbody></table></div>
<div class="foot"><span>公开数据接口 · 非逐笔数据</span><span>约60秒刷新</span></div>
</section>
<p class="notice">重要说明：本页面尝试读取东方财富公开行情接口。接口可能延迟、限流、调整字段，或因手机浏览器跨域限制而无法访问。失败时会显示错误，不会用模拟数字冒充实时数据。主力资金是数据供应商统计口径，不等于真实机构账户资金，也不构成投资建议。当前版本尚未接入手机推送服务端；每日15:10收盘报告由此前已设置的独立任务负责。</p>
</main>
<script>
const API='https://push2.eastmoney.com/api/qt/clist/get',FIELDS='f12,f14,f3,f62,f184';
let kind='industry',busy=false;
const $=id=>document.getElementById(id);
const money=n=>{if(!Number.isFinite(n))return'—';const a=Math.abs(n);return(n<0?'-':'')+(a>=1e8?(a/1e8).toFixed(2)+'亿':a>=1e4?(a/1e4).toFixed(0)+'万':a.toFixed(0)+'元')};
const pct=n=>Number.isFinite(n)?(n>0?'+':'')+n.toFixed(2)+'%':'—';
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){
 if(busy)return;busy=true;$('status').textContent='更新中…';$('refresh').disabled=true;
 try{
  const fs=kind==='industry'?'m:90+t:2':'m:90+t:3';
  const url=API+'?pn=1&pz=80&po=1&np=1&fltt=2&invt=2&fid=f62&fs='+encodeURIComponent(fs)+'&fields='+FIELDS+'&_='+Date.now();
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
  const response=await fetch(url,{signal:controller.signal,cache:'no-store'});clearTimeout(timer);
  if(!response.ok)throw Error('HTTP '+response.status);
  const json=await response.json(),list=json?.data?.diff;
  if(!Array.isArray(list))throw Error('数据格式异常或接口暂不可用');
  const data=list.map(x=>({name:x.f14,change:Number(x.f3),net:Number(x.f62),ratio:Number(x.f184)})).filter(x=>x.name&&Number.isFinite(x.net)).sort((a,b)=>b.net-a.net);
  if(!data.length)throw Error('暂无有效资金数据');
  $('count').textContent=data.length+' 个';
  $('inCount').textContent=data.filter(x=>x.net>0).length;
  $('outCount').textContent=data.filter(x=>x.net<0).length;
  $('rows').innerHTML=data.map((x,i)=>'<tr><td><span class="name">'+(i+1)+'. '+safe(x.name)+'</span></td><td class="'+(x.change>0?'pos':x.change<0?'neg':'neutral')+'">'+pct(x.change)+'</td><td class="'+(x.net>0?'pos':x.net<0?'neg':'neutral')+'">'+money(x.net)+'</td><td class="muted">'+(Number.isFinite(x.ratio)?x.ratio.toFixed(2)+'%':'—')+'</td></tr>').join('');
  $('status').textContent='数据已更新';$('updated').textContent='更新时间：'+new Date().toLocaleString('zh-CN',{hour12:false});
 }catch(e){
  $('status').textContent='数据暂不可用';
  $('rows').innerHTML='<tr><td colspan="4" class="error">获取失败：'+safe(e.message)+'<br>请稍后手动刷新；当前不展示虚构数据。</td></tr>';
  $('updated').textContent='最近一次请求失败';
 }finally{busy=false;$('refresh').disabled=false}
}
document.querySelectorAll('[data-kind]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-kind]').forEach(x=>x.classList.remove('active'));button.classList.add('active');kind=button.dataset.kind;$('tableTitle').textContent=kind==='industry'?'行业板块资金排名':'概念板块资金排名';load()}));
$('refresh').addEventListener('click',load);load();setInterval(load,60000);
</script>
</body></html>
